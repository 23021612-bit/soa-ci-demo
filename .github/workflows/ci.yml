name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --junitxml=junit.xml

      - name: Write job summary
        if: always()
        run: |
          echo "### Test run (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  api-lint:
    name: OpenAPI lint (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint openapi.yaml
        run: npx --yes @stoplight/spectral-cli lint openapi.yaml

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test, api-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t soa-ci-demo:${{ github.sha }} .

      - name: Run container
        run: docker run -d --name api -p 8000:8000 soa-ci-demo:${{ github.sha }}

      - name: Smoke test /health
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Service is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become healthy"
          exit 1

      - name: Smoke test create + read task
        run: |
          curl -fsS -X POST http://localhost:8000/api/v1/tasks \
            -H "Content-Type: application/json" \
            -d '{"title": "from CI"}'
          echo
          curl -fsS http://localhost:8000/api/v1/tasks

      - name: Show container logs on failure
        if: failure()
        run: docker logs api
